name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  # The release workflow starts CI this way on the release PR's branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}
      - if: matrix.task == 'test'
        run: bash apps/server/test/broker-linux.sh
      - if: matrix.task == 'test'
        run: bash scripts/test-plugin-template.sh

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash deploy/test/image-contract.sh
      - run: bash deploy/test/host-contract.sh
